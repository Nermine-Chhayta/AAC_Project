name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip and packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify pytest installed
        run: python -m pip list | grep pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t task-tracker .

      - name: Run Docker container and verify /health
        run: |
          docker run -d --rm --name task-tracker -p 8000:8000 task-tracker
          for i in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health | grep '"status":"ok"'
          docker stop task-tracker
